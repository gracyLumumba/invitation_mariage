<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Login civil — Yannick & Chantia</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Jost:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #D4A5A5;
    --rose-fonce: #B5838A;
    --mauve: #C5B9D6;
    --mauve-fonce: #A18CB5;
    --lavande: #E8E0F5;
    --beige: #F5F0E8;
    --cream: #FAF7F2;
    --text: #2C1F1F;
    --text-light: #7A6060;
    --white: #FFFFFF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(145deg, var(--lavande) 0%, var(--cream) 58%, var(--beige) 100%);
    padding: 1.5rem;
    font-family: 'Jost', sans-serif;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: "✿ ✻ ❀ ✤ ✿";
    position: fixed;
    bottom: 15px;
    left: 15px;
    font-size: 45px;
    opacity: 0.08;
    pointer-events: none;
    letter-spacing: 10px;
  }
  body::after {
    content: "✿ ❀ ✻ ✤ ✿";
    position: fixed;
    top: 15px;
    right: 15px;
    font-size: 45px;
    opacity: 0.08;
    pointer-events: none;
    transform: rotate(10deg);
    letter-spacing: 10px;
  }
  .login-wrap { width: 100%; max-width: 460px; position: relative; z-index: 1; }
  .login-card {
    background: var(--white);
    border-radius: 28px;
    padding: 2rem 1.8rem;
    text-align: center;
    position: relative;
    box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    border: 1px solid rgba(197, 185, 214, 0.3);
  }
  .login-card::before {
    content: '';
    position: absolute;
    inset: 12px;
    border: 1px solid rgba(197, 185, 214, 0.4);
    border-radius: 22px;
    pointer-events: none;
  }
  .login-subtitle {
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--rose-fonce);
    margin-bottom: 0.5rem;
  }
  .login-title {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(48px, 12vw, 68px);
    font-weight: 300;
    color: var(--rose-fonce);
    line-height: 0.95;
    margin-bottom: 0.25rem;
  }
  .login-amp { font-style: italic; color: var(--mauve-fonce); font-size: 0.9em; }
  .login-date {
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    font-style: italic;
    color: var(--mauve-fonce);
    margin-bottom: 0.5rem;
  }
  .divider {
    width: 50px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--mauve), transparent);
    margin: 0.8rem auto;
  }
  .login-note {
    font-size: 12.5px;
    color: var(--text-light);
    line-height: 1.7;
    font-style: italic;
    margin-bottom: 1.5rem;
    text-align: center;
  }
  .form-group { margin-bottom: 1.2rem; text-align: left; }
  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--rose-fonce);
    margin-bottom: 6px;
  }
  .form-input {
    width: 100%;
    padding: 12px 15px;
    border: 1px solid #ddd;
    border-radius: 40px;
    font-family: inherit;
    font-size: 15px;
    transition: all 0.2s;
  }
  .form-input:focus {
    outline: none;
    border-color: var(--rose);
    box-shadow: 0 0 0 3px rgba(212, 165, 165, 0.2);
  }
  .btn-primary {
    width: 100%;
    background: linear-gradient(135deg, var(--rose), var(--rose-fonce));
    color: white;
    border: none;
    padding: 12px;
    border-radius: 40px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 0.5rem;
  }
  .btn-primary:hover {
    background: linear-gradient(135deg, var(--rose-fonce), var(--rose));
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(181, 131, 138, 0.3);
  }
  .spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid var(--beige);
    border-top-color: var(--rose);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .alert {
    padding: 10px 12px;
    border-radius: 16px;
    font-size: 12px;
    margin-top: 12px;
    text-align: center;
    display: none;
  }
  .alert-danger {
    background: #FEF2F2;
    border: 1px solid #FECACA;
    color: #991B1B;
  }
  .alert-danger.show { display: block; }
  .loading { display: none; text-align: center; margin-top: 0.75rem; }
  @media (max-width: 480px) {
    body { padding: 1rem; }
    .login-card { padding: 1.5rem; }
    .login-title { font-size: 48px; }
  }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-subtitle">Login civil</div>
    <div class="login-title">Yannick <span class="login-amp">&amp;</span> Chantia</div>
    <div class="login-date">Vendredi 3 juillet 2026</div>
    <div class="divider"></div>
    <p class="login-note">
      Cette invitation est strictement personnelle.<br>
      Veuillez saisir votre nom et votre code secret pour accéder à votre invitation.
    </p>

    <div class="form-group">
      <label class="form-label" for="nom">Votre nom</label>
      <input class="form-input" id="nom" type="text" placeholder="ex: Sophie Martin" autocomplete="name" />
    </div>
    <div class="form-group">
      <label class="form-label" for="code">Code secret</label>
      <input class="form-input" id="code" type="text" placeholder="ex: YC01" maxlength="6" autocomplete="off" style="text-transform:uppercase;letter-spacing:0.15em;text-align:center;" />
    </div>
    <button class="btn-primary" id="btn-login">
      Accéder à mon invitation
    </button>
    <div class="loading" id="loading"><span class="spinner"></span></div>
    <div class="alert alert-danger" id="err-msg"></div>
  </div>
  <p style="text-align:center;font-size:11px;color:var(--text-light);margin-top:1rem;">
    Votre nom et votre code vous ont été communiqués par les mariés.<br>
    En cas de problème, contactez Yannick ou Chantia.
  </p>
</div>

<script>
function seConnecter() {
  const nom = document.getElementById('nom').value.trim();
  const code = document.getElementById('code').value.trim().toUpperCase();
  const errEl = document.getElementById('err-msg');
  const btn = document.getElementById('btn-login');
  const load = document.getElementById('loading');

  errEl.className = 'alert alert-danger';
  if (!nom) { errEl.textContent = 'Veuillez saisir votre nom.'; errEl.classList.add('show'); return; }
  if (!code) { errEl.textContent = 'Veuillez saisir votre code secret.'; errEl.classList.add('show'); return; }

  btn.disabled = true;
  load.style.display = 'block';

  fetch('/api/connexion', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nom, code_secret: code })
  })
  .then(res => res.json())
  .then(data => {
    if (data.ok) {
      window.location.href = '/invitation-mariage-civile';
    } else {
      errEl.textContent = data.erreur || 'Nom ou code incorrect.';
      errEl.classList.add('show');
    }
  })
  .catch(() => {
    errEl.textContent = 'Erreur de connexion. Vérifiez votre réseau.';
    errEl.classList.add('show');
  })
  .finally(() => {
    btn.disabled = false;
    load.style.display = 'none';
  });
}

document.getElementById('code').addEventListener('input', function() {
  this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
});
document.getElementById('btn-login').addEventListener('click', seConnecter);
document.getElementById('nom').addEventListener('keypress', (e) => { if (e.key === 'Enter') seConnecter(); });
document.getElementById('code').addEventListener('keypress', (e) => { if (e.key === 'Enter') seConnecter(); });
</script>
</body>
</html>
