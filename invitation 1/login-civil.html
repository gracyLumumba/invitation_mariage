<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Mariage Civil Yannick & Chantia</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Jost:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root {
  --marsala:#9C27B0;--marsala-dark:#7B1FA2;--marsala-light:#E91E63;
  --gold:#D81B60;--gold-light:#F48FB1;--gold-pale:#FCE4EC;
  --beige:#F3E5F5;--beige-dark:#E1BEE7;--cream:#FFF0F5;
  --text:#2C1F1F;--text-light:#7A6060;--white:#FFFFFF;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Jost',sans-serif;background:var(--cream);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem;}
.login-card{background:var(--white);padding:2.5rem;border-radius:2px;box-shadow:0 12px 40px rgba(156,39,176,0.1);width:100%;max-width:420px;text-align:center;position:relative;border:1px solid var(--beige-dark);overflow:hidden;}
.login-card::before{content:'';position:absolute;inset:8px;border:1px solid var(--gold-pale);pointer-events:none;}
.header-icon{font-size:3rem;color:var(--marsala);margin-bottom:1rem;filter:drop-shadow(0 4px 10px rgba(156,39,176,0.2));}
.title{font-family:'Great Vibes',cursive;font-size:2.5rem;color:var(--marsala);margin-bottom:0.5rem;}
.subtitle{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-style:italic;color:var(--text-light);margin-bottom:2rem;letter-spacing:0.05em;}
.form-group{margin-bottom:1.5rem;text-align:left;position:relative;z-index:1;}
label{display:block;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.15em;color:var(--text-light);margin-bottom:0.5rem;padding-left:0.2rem;}
input{width:100%;padding:12px 16px;border:1px solid var(--beige-dark);background:var(--cream);color:var(--text);font-size:1rem;outline:none;transition:all 0.3s;}
input:focus{border-color:var(--marsala-light);background:var(--white);box-shadow:0 0 0 4px rgba(233,30,99,0.05);}
.btn-login{width:100%;padding:14px;background:var(--marsala);color:var(--white);border:none;font-size:0.85rem;text-transform:uppercase;letter-spacing:0.2em;cursor:pointer;transition:all 0.3s;margin-top:0.5rem;position:relative;z-index:1;}
.btn-login:hover{background:var(--marsala-dark);transform:translateY(-1px);box-shadow:0 4px 12px rgba(123,31,162,0.3);}
.btn-login:disabled{opacity:0.7;cursor:not-allowed;}
.error-msg{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;padding:12px;font-size:0.85rem;margin-bottom:1.5rem;display:none;animation:shake 0.4s ease-in-out;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.footer-text{margin-top:2rem;font-size:0.75rem;color:var(--text-light);font-style:italic;}
.ornament{position:absolute;color:var(--gold-pale);opacity:0.4;z-index:0;pointer-events:none;}
.top-right{top:-20px;right:-20px;width:100px;transform:rotate(15deg);}
.bottom-left{bottom:-20px;left:-20px;width:100px;transform:rotate(195deg);}
.spinner{display:none;width:1.2rem;height:1.2rem;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="login-card">
  <div class="ornament top-right">
    <svg viewBox="0 0 100 100" fill="currentColor"><path d="M10 90 Q40 40 90 10 Q60 60 10 90Z"/></svg>
  </div>
  <div class="ornament bottom-left">
    <svg viewBox="0 0 100 100" fill="currentColor"><path d="M10 90 Q40 40 90 10 Q60 60 10 90Z"/></svg>
  </div>

  <div class="header-icon"><i data-lucide="heart"></i></div>
  <h1 class="title">Yannick & Chantia</h1>
  <p class="subtitle">Mariage Civil — 2 Juillet 2026</p>

  <div id="error" class="error-msg"></div>

  <form id="loginForm">
    <div class="form-group">
      <label for="nom">Nom complet</label>
      <input type="text" id="nom" name="nom" placeholder="" required autocomplete="name">
    </div>
    <div class="form-group">
      <label for="code">Code secret</label>
      <input type="text" id="code" name="code" placeholder="" required style="text-transform: uppercase;">
    </div>
    <button type="submit" class="btn-login" id="submitBtn">
      <span id="btnText">Accéder à mon invitation</span>
      <div class="spinner" id="spinner"></div>
    </button>
  </form>

  <p class="footer-text">Veuillez entrer les informations indiquées sur votre carton d'invitation.</p>
</div>

<script>
window.addEventListener('load', () => {
  if (window.lucide) window.lucide.createIcons();
  
  const urlParams = new URLSearchParams(window.location.search);
  const codeParam = urlParams.get('code');
  if (codeParam) {
    document.getElementById('code').value = codeParam.toUpperCase();
  }
});

const form = document.getElementById('loginForm');
const errorDiv = document.getElementById('error');
const submitBtn = document.getElementById('submitBtn');
const btnText = document.getElementById('btnText');
const spinner = document.getElementById('spinner');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const nom = document.getElementById('nom').value.trim();
  const code_secret = document.getElementById('code').value.trim().toUpperCase();
  
  if (!nom || !code_secret) return;

  errorDiv.style.display = 'none';
  submitBtn.disabled = true;
  btnText.style.display = 'none';
  spinner.style.display = 'block';

  try {
    const response = await fetch('/api/connexion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        nom, 
        code_secret,
        redirect: '/invitation-mariage-civile' 
      })
    });

    const data = await response.json();

    if (response.ok && data.ok) {
      window.location.href = data.redirect;
    } else {
      throw new Error(data.erreur || 'Une erreur est survenue');
    }
  } catch (err) {
    errorDiv.textContent = err.message;
    errorDiv.style.display = 'block';
    submitBtn.disabled = false;
    btnText.style.display = 'block';
    spinner.style.display = 'none';
  }
});
</script>
</body>
</html>
