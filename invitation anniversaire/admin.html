<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Invitation Anniversaire</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff4fa3;
    --pink-dark:#e60073;
    --bg:#fff6fa;
    --text:#241c26;
    --muted:#71606e;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Jost',sans-serif;
    background:linear-gradient(145deg, #ffd9ea 0%, var(--bg) 55%, #fff 100%);
    color:var(--text);
    padding:24px;
  }
  .wrap{max-width:1180px;margin:0 auto}
  .top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:20px;
  }
  .card{
    background:#fff;
    border:1px solid rgba(230,0,115,.14);
    border-radius:24px;
    box-shadow:0 18px 50px rgba(230,0,115,.08);
    padding:20px;
  }
  .title{
    font-size:30px;
    margin:0 0 6px;
    color:var(--pink-dark);
  }
  .sub{margin:0;color:var(--muted)}
  .grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin:18px 0;
  }
  .stat{
    text-align:center;
  }
  .stat .n{font-size:34px;font-weight:700;color:var(--pink-dark)}
  .stat .l{text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--muted)}
  .login{
    max-width:420px;
    margin:60px auto;
  }
  label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}
  input{
    width:100%;
    border:1px solid rgba(230,0,115,.14);
    border-radius:14px;
    padding:13px 14px;
    margin-bottom:12px;
  }
  button{
    width:100%;
    border:none;
    border-radius:999px;
    padding:13px 16px;
    color:#fff;
    background:linear-gradient(135deg, var(--pink) 0%, var(--pink-dark) 100%);
    text-transform:uppercase;
    letter-spacing:.12em;
    font-weight:600;
    cursor:pointer;
  }
  .table{
    width:100%;
    border-collapse:collapse;
  }
  .table th,.table td{
    padding:12px 10px;
    border-bottom:1px solid #f1dce8;
    text-align:left;
    vertical-align:top;
    font-size:14px;
  }
  .table th{
    text-transform:uppercase;
    letter-spacing:.08em;
    font-size:11px;
    color:var(--muted);
  }
  .pill{
    display:inline-block;
    padding:6px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
  }
  .present{background:#ecfdf5;color:#166534}
  .absent{background:#fff1f2;color:#9f1239}
  .pending{background:#f8fafc;color:#334155}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .actions button,.actions a{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:11px 14px;
    border-radius:999px;
    text-decoration:none;
    font-size:13px;
    font-weight:600;
  }
  .actions a{background:#fff;border:1px solid rgba(230,0,115,.14);color:var(--pink-dark)}
  .actions button{width:auto}
  .row-actions{display:flex;gap:7px;flex-wrap:wrap}
  .row-actions button{width:auto;padding:8px 11px;font-size:11px;letter-spacing:.06em}
  .row-actions .edit-btn{background:#fff;color:var(--pink-dark);border:1px solid rgba(230,0,115,.2)}
  .row-actions .delete-btn{background:#fff1f2;color:#9f1239;border:1px solid #fecdd3}
  .empty{padding:28px 12px;text-align:center;color:var(--muted)}
  .error{display:none;margin:0 0 12px;padding:12px 14px;background:#fff1f2;border:1px solid #fecdd3;color:#991b1b;border-radius:12px}
  .hidden{display:none}
  @media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:640px){.grid{grid-template-columns:1fr}.table{display:block;overflow:auto}}
</style>
</head>
<body>
  <div class="wrap">
    <div id="loginBox" class="card login">
      <h1 class="title">Admin anniversaire</h1>
      <p class="sub">Connecte-toi pour voir les noms et les confirmations de présence.</p>
      <div id="loginError" class="error"></div>
      <label for="password">Mot de passe admin</label>
      <input id="password" type="password" placeholder="Mot de passe">
      <button id="loginBtn" type="button">Entrer</button>
    </div>

    <div id="dashboard" class="hidden">
      <div class="top">
        <div class="card" style="flex:1">
          <h1 class="title" style="margin-bottom:0">Tableau de bord</h1>
          <p class="sub">Lucé Tshibola - invitation d’anniversaire</p>
          <div class="actions">
            <button id="refreshBtn" type="button">Rafraîchir</button>
            <button id="logoutBtn" type="button" style="background:#fff;color:var(--pink-dark);border:1px solid rgba(230,0,115,.14)">Déconnexion</button>
            <a href="/api/admin/export" target="_blank" rel="noopener noreferrer">Exporter JSON</a>
            <button id="pdfBtn" type="button">Imprimer PDF des presents</button>
          </div>
        </div>
      </div>

      <div class="grid">
        <div class="card stat"><div class="n" id="sTotal">0</div><div class="l">invites</div></div>
        <div class="card stat"><div class="n" id="sPresent">0</div><div class="l">présents</div></div>
        <div class="card stat"><div class="n" id="sAbsent">0</div><div class="l">absents</div></div>
        <div class="card stat"><div class="n" id="sPending">0</div><div class="l">en attente</div></div>
      </div>

      <div class="card">
        <h2 style="margin-top:0;color:var(--pink-dark)">Invités</h2>
        <table class="table">
          <thead>
            <tr>
              <th>Nom</th>
              <th>Connexion</th>
              <th>Présence</th>
              <th>IP</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="visitorsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
const loginBox = document.getElementById('loginBox');
const dashboard = document.getElementById('dashboard');
const errorBox = document.getElementById('loginError');

function badge(status) {
  if (status === 'present') return '<span class="pill present">présent</span>';
  if (status === 'absent') return '<span class="pill absent">absent</span>';
  return '<span class="pill pending">en attente</span>';
}

function renderVisitors(visitors) {
  const body = document.getElementById('visitorsBody');
  if (!visitors.length) {
    body.innerHTML = '<tr><td colspan="5" class="empty">Aucun invite enregistre pour le moment.</td></tr>';
    return;
  }
  body.innerHTML = visitors.map(v => `
    <tr>
      <td><strong>${escapeHtml(v.name || '')}</strong><div style="color:#6b7280;font-size:12px">connexions: ${v.loginCount || 0}</div></td>
      <td>${new Date(v.loginAt || v.createdAt || Date.now()).toLocaleString('fr-FR')}</td>
      <td>${badge(v.status)}</td>
      <td>${escapeHtml(v.lastIp || '')}</td>
      <td><div class="row-actions">
        <button class="edit-btn" type="button" data-action="edit" data-id="${escapeHtml(v.id)}" data-name="${escapeHtml(v.name || '')}">Modifier</button>
        <button class="delete-btn" type="button" data-action="delete" data-id="${escapeHtml(v.id)}">Supprimer</button>
      </div></td>
    </tr>
  `).join('');
}

async function loadData() {
  const res = await fetch('/api/admin/data');
  const data = await res.json();
  if (!res.ok || !data.ok) throw new Error(data.erreur || 'Accès refusé');
  document.getElementById('sTotal').textContent = data.stats.total;
  document.getElementById('sPresent').textContent = data.stats.present;
  document.getElementById('sAbsent').textContent = data.stats.absent;
  document.getElementById('sPending').textContent = data.stats.pending;
  renderVisitors(data.visitors);
  return data;
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

async function login() {
  errorBox.style.display = 'none';
  const password = document.getElementById('password').value;
  const res = await fetch('/api/admin/login', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ password })
  });
  const data = await res.json();
  if (!res.ok || !data.ok) throw new Error(data.erreur || 'Mot de passe invalide');
  loginBox.classList.add('hidden');
  dashboard.classList.remove('hidden');
  await loadData();
}

document.getElementById('loginBtn').addEventListener('click', () => login().catch(err => {
  errorBox.textContent = err.message;
  errorBox.style.display = 'block';
}));
document.getElementById('refreshBtn').addEventListener('click', () => loadData().catch(alert));
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/admin/logout', { method: 'POST' });
  location.reload();
});

document.getElementById('pdfBtn').addEventListener('click', async () => {
  try {
    const data = await loadData();
    const present = data.visitors.filter(v => v.status === 'present');
    const rows = present.length
      ? present.map((v, index) => `<tr><td>${index + 1}</td><td>${escapeHtml(v.name || '')}</td><td>Present</td></tr>`).join('')
      : '<tr><td colspan="3">Aucun invite present pour le moment.</td></tr>';
    const printWindow = window.open('', '_blank', 'width=900,height=700');
    if (!printWindow) throw new Error('Autorisez les fenetres contextuelles pour imprimer le PDF.');
    printWindow.document.write(`<!doctype html><html lang="fr"><head><meta charset="UTF-8"><title>Invites presents - Luce Tshibola</title><style>body{font-family:Arial,sans-serif;color:#241c26;padding:32px}h1{color:#e60073}p{color:#71606e}table{width:100%;border-collapse:collapse;margin-top:24px}th,td{padding:12px;border:1px solid #e8bfd4;text-align:left}th{background:#fff0f7;color:#e60073}</style></head><body><h1>Invites presents</h1><p>Anniversaire de 1 an de Luce Tshibola - 19 septembre 2026</p><table><thead><tr><th>N°</th><th>Nom</th><th>Reponse</th></tr></thead><tbody>${rows}</tbody></table><script>window.onload=()=>window.print();<\/script></body></html>`);
    printWindow.document.close();
  } catch (error) {
    alert(error.message || 'Impossible de preparer le PDF.');
  }
});

document.getElementById('visitorsBody').addEventListener('click', async (event) => {
  const button = event.target.closest('button[data-action]');
  if (!button) return;
  const id = button.dataset.id;

  if (button.dataset.action === 'edit') {
    const name = prompt('Nouveau nom de l’invité :', button.dataset.name || '');
    if (name === null || !name.trim()) return;
    const res = await fetch('/api/admin/visitors/' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name: name.trim() })
    });
    const data = await res.json();
    if (!res.ok || !data.ok) return alert(data.erreur || 'Modification impossible.');
    await loadData();
  }

  if (button.dataset.action === 'delete') {
    if (!confirm('Supprimer définitivement cet invité et son historique ?')) return;
    const res = await fetch('/api/admin/visitors/' + encodeURIComponent(id), { method: 'DELETE' });
    const data = await res.json();
    if (!res.ok || !data.ok) return alert(data.erreur || 'Suppression impossible.');
    await loadData();
  }
});

fetch('/api/admin/data')
  .then(async (res) => {
    if (!res.ok) throw new Error('not admin');
    const data = await res.json();
    loginBox.classList.add('hidden');
    dashboard.classList.remove('hidden');
    document.getElementById('sTotal').textContent = data.stats.total;
    document.getElementById('sPresent').textContent = data.stats.present;
    document.getElementById('sAbsent').textContent = data.stats.absent;
    document.getElementById('sPending').textContent = data.stats.pending;
    renderVisitors(data.visitors);
  })
  .catch((error) => {
    errorBox.textContent = error.message || 'Impossible de charger les invites.';
    errorBox.style.display = 'block';
  });
</script>
</body>
</html>
